default_bang: g

bangs:
  - trigger: g
    name: Google
    url_template: "https://www.google.com/search?q={{{s}}}"
    # home_url 생략 시 url_template에서 자동 추출 → https://www.google.com
    # suggest_url_template 설정 시 주소창 입력 중 자동완성 제안 제공 (Firefox 등)
    suggest_url_template: "https://suggestqueries.google.com/complete/search?client=firefox&q={{{s}}}"

  - trigger: w
    name: Wikipedia
    url_template: "https://en.wikipedia.org/wiki/Special:Search?search={{{s}}}"
    suggest_url_template: "https://en.wikipedia.org/w/api.php?action=opensearch&search={{{s}}}"

  - trigger: yt
    name: YouTube
    url_template: "https://www.youtube.com/results?search_query={{{s}}}"
    suggest_url_template: "https://suggestqueries.google.com/complete/search?client=firefox&ds=yt&q={{{s}}}"

  - trigger: gh
    name: GitHub
    url_template: "https://github.com/search?q={{{s}}}"

  - trigger: ghe
    name: GitHub
    url_template: "https://github.com/search?q={{{s}}}"
    home_url: "https://naver.com"

  - trigger: so
    name: Stack Overflow
    url_template: "https://stackoverflow.com/search?q={{{s}}}"

  - trigger: npm
    name: npm
    url_template: "https://www.npmjs.com/search?q={{{s}}}"

  - trigger: mdn
    name: MDN Web Docs
    url_template: "https://developer.mozilla.org/en-US/search?q={{{s}}}"

  - trigger: custom
    name: Custom Site
    url_template: "https://example.com/search?q={{{s}}}"
    home_url: "https://example.com/home" # 명시적으로 다른 경로 지정 가능
