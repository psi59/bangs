name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: bangs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run -d --name bangs -p 8080:8080 \
            -v "$PWD/bangs.example.yaml:/app/bangs.yaml:ro" bangs:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:8080/health && break
            sleep 0.5
          done
          echo
          curl -sf -o /dev/null -w '%{http_code} %{redirect_url}\n' \
            'http://localhost:8080/search?q=g+hello' | tee /tmp/search.txt
          grep -q '^302 https://www.google.com/search?q=hello$' /tmp/search.txt
          docker inspect --format '{{.State.Running}}' bangs | grep -q true

      - name: Show container logs
        if: always()
        run: docker logs bangs || true
